# Jahreswechsel-Wächter (Audit K-11): schlägt fehl, wenn für das laufende Kalenderjahr keine Regeldatei existiert.
# Kein Pflicht-Check für main: der Rechner zeigt in diesem Fall ein Banner und rechnet mit den Werten des Vorjahres.
name: regeljahr

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['src/rules/**', '.github/workflows/regeljahr.yml']

permissions:
  contents: read

jobs:
  regeljahr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: REGELJAHR_STRENG=1 npx vitest run src/rules/regeljahr.test.ts
